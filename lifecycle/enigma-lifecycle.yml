versioning:
  graphql:
    scheme: unversioned
    model: graph-model-1
    endpoint: https://api.enigma.com/graphql
    data_asset_version_header: x-enigma-data-asset-version
    data_asset_version_observed: release_master_fast_er_20260728
    data_asset_note: >-
      Every GraphQL response carries x-enigma-data-asset-version identifying the
      underlying data release (observed 2026-08-14). The API contract is unversioned; the
      DATA is versioned and surfaced per response. That is the only version signal a
      client gets.
  kyb:
    scheme: uri-path
    current: v2
    endpoint: https://api.enigma.com/v2/kyb/
    legacy_compat_endpoint: https://api.enigma.com/v2/kyb-legacy/
    legacy_compat_note: >-
      A drop-in replacement that keeps the v1 response shape while returning improved v2
      data, for integrations that cannot change. A real, documented migration off-ramp.
  screening:
    scheme: uri-path-namespace
    endpoint: https://api.enigma.com/evaluation/sanctions/
  v1_legacy:
    scheme: uri-path
    status: legacy
    endpoints:
    - 'POST /businesses/match'
    - 'GET /businesses/{id}'
    - 'POST /v1/kyb'
    docs: https://documentation.enigma.com/v1/reference/apis/
    banner: >-
      "This is legacy documentation maintained for existing customers only. New
      implementations should use our contemporary platform powered by graph-model-1."
deprecation:
  policy_url: null
  sunset_header: false
  sunset_dates_published: false
  note: >-
    Enigma runs a real two-generation migration (v1 → graph-model-1 / KYB v2, with a
    kyb-legacy compatibility endpoint and a documented "Migrating from KYB v1?" path) and
    marks two GraphQL queries deprecated in its own reference — but it publishes NO
    written deprecation policy, no notice period, no sunset date, and no RFC 8594
    Sunset/Deprecation headers. The migration is documented; the commitment is not.
  legacy_surfaces_still_listed_on_status_page:
  - Business API
  - KYB Service v1
