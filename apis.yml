apis:
- name: Enigma GraphQL Data API
  description: >-
    GraphQL API for querying Enigma business data — brands, operating locations, legal
    entities, card transactions, and industries — with text, lookup, natural-language
    prompt, and async segmentation search patterns over the Identity Graph.
  humanURL: https://documentation.enigma.com/guides/graphql/api
  baseURL: https://api.enigma.com/graphql
