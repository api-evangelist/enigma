- name: Enigma KYB REST API
  description: >-
    REST API for business identity verification and compliance — identify and verify
    packages with TIN/EIN verification, OFAC watchlist screening, and SSN verification
    add-on tasks. A /v2/kyb-legacy/ endpoint returns the v1 response shape over v2 data
    for integrations that cannot migrate.
  humanURL: https://documentation.enigma.com/kyb
  baseURL: https://api.enigma.com/v2/kyb/
  tags:
  - KYB
  - Compliance
  - Screening
  properties:
  - type: GettingStarted
    url: https://documentation.enigma.com/kyb/verify-identity
  - type: Documentation
    url: https://documentation.enigma.com/kyb
  - type: AgentSkill
    url: skills/enigma-kyb.md
- name: Enigma Screening API
  description: >-
    REST API for sanctions and watchlist screening of customers and transactions.
    Weighted-attribute ENTITY screening and unstructured TEXT screening, plus
    LLM-enhanced variants that add live web search; watchlist view discovery, stored
    screening configurations, decision/case management, and file-based batch screening.
  humanURL: https://documentation.enigma.com/screening/api
  baseURL: https://api.enigma.com/evaluation/sanctions/
  tags:
