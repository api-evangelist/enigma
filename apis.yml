aid: enigma
name: Enigma
description: >-
  Enigma provides business identity infrastructure for the United States, built on
  entity-resolution technology that links brands, DBAs, operating locations, legal
  entities, and ownership into unified business records. Its Identity Graph aggregates
  hundreds of public and third-party sources plus 750M+ anonymized cards and 30B+ annual
  transactions, powering KYB and onboarding, sanctions and negative-news screening,
  payment risk and underwriting, and go-to-market data. Developers access this through a
  GraphQL Data API, a KYB v2 REST API, a sanctions Screening REST API, and a remote MCP
  server exposing sixteen published tools under OAuth 2.1. Enigma also publishes its own
  Agent Skills as a Claude Code plugin, an llms.txt, and hard plan-tiered rate limits.
