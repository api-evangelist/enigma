summary: >-
  Enigma has no separate sandbox host and no test/live key split — the same x-api-key and
  the same api.enigma.com hosts serve production data on every plan. What it does publish
  is (a) a free Console tier where browsing, search and live summaries cost nothing, (b) a
  browser GraphQL explorer, and (c) a named testing watchlist view for integrating against
  the Screening API without hitting a real sanctions list.
test_live_separation:
  supported: false
  key_prefixes: null
  note: >-
    One API key per account, issued from the Enigma Console. No documented test-mode key,
    no key prefix convention, no sandbox base URL. Billing is metered per returned fill,
    so integration testing consumes real credits except where noted below.
consoles:
- name: Enigma Console
  url: https://console.enigma.com/
  description: >-
    Browse, search and preview the business graph. On the Free plan viewing, search and
    live summaries cost no credits within standard rate limits, which is the closest
    thing to a no-cost evaluation surface.
- name: GraphQL Explorer
  url: https://console.enigma.com/explore/graphql
  description: >-
    In-browser GraphQL playground for the Data API. Named as the playground in Enigma's
    own enigma-graphql Agent Skill.
- name: Agent tools page (Console)
  url: https://console.enigma.com/
  description: >-
    Per the MCP guide, the Console's Agent tools page renders copy-paste MCP client
    configuration with the account's API key pre-filled for Claude Code, Cursor, VS Code
    and Gemini CLI.
