  - tool: get_brand_legal_entities
    daily: 500
    monthly: 8000
  - tool: get_brand_card_analytics
    daily: 500
    monthly: 8000
  - tool: search_gov_archive
    daily: 500
    monthly: 6000
  - tool: generate_brands_segment
    daily: 100
    monthly: 1000
  - tool: generate_locations_segment
    daily: 100
    monthly: 1000
  - tool: search_kyb
    daily: 100
    monthly: 2000
  - tool: search_negative_news
    daily: 100
    monthly: 2000
notes:
- All query types count toward the GraphQL rate limit regardless of shape.
- A 429 can come from the per-second, burst, or daily limit; the docs tell clients to
  check which before retrying in a loop.
