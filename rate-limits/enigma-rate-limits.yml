limit_count: 14
summary: >-
  Enigma publishes hard, plan-tiered rate limits for the GraphQL Data API and per-tool
  daily/monthly limits for every MCP tool. KYB API limits are contract-specific and not
  published. Exhaustion returns 429 with a Retry-After header carrying the number of
  seconds to wait.
signaling:
  status_code: 429
  status_text: Slow Down
  headers:
  - name: Retry-After
    description: >-
      Seconds to wait before retrying. Published as present on EVERY 429. Docs instruct
      clients to treat it as a minimum wait, not a suggestion.
    required_by_docs: true
  observed_headers_on_unauthenticated_call: []
  observed_note: >-
    An unauthenticated POST to https://api.enigma.com/graphql returns 401 with no
    RateLimit-*/X-RateLimit-* headers, so the runtime quota signal could not be observed
    anonymously; only the documented Retry-After behavior on 429 is recorded here.
  retry_guidance: >-
    KYB: exponential backoff starting at 1 second, doubling each retry, capped at 60
    seconds. GraphQL/MCP: honor Retry-After, then back off further on repeated 429s.
limits:
- api: Enigma GraphQL Data API
  plan: Trial
  scope: per-account-plan
  window: 1s
  limit: 10
  unit: requests-per-second
  burst: 20
  daily_limit: 100000
- api: Enigma GraphQL Data API
  plan: Pro
  scope: per-account-plan
  window: 1s
  limit: 50
  unit: requests-per-second
  burst: 100
  daily_limit: 500000
- api: Enigma GraphQL Data API
  plan: Max
  scope: per-account-plan
  window: 1s
  limit: 50
  unit: requests-per-second
  burst: 100
  daily_limit: 500000
- api: Enigma GraphQL Data API
  plan: Enterprise
  scope: per-account-plan
  window: 1s
  limit: 100
  unit: requests-per-second
  burst: 200
  daily_limit: null
  note: No daily limit on Enterprise.
- api: Enigma KYB REST API
  plan: all
  scope: per-account-contract
  limit: null
  note: >-
    "KYB API rate limits vary by plan and contract. Contact Enigma support to confirm the
    limits for your account." Not published.
mcp_tool_limits:
  applies_to_plans: [Pro, Max]
  window_daily: rolling-24h
  window_monthly: rolling-30d
  independent_per_tool: true
  status_on_exhaustion: 429
  note: Enterprise MCP tool limits are configurable per organization and not published.
  tools:
  - tool: search_business
    daily: 500
    monthly: 8000
  - tool: search_person
    daily: 500
    monthly: 8000
  - tool: get_brand_locations
    daily: 500
