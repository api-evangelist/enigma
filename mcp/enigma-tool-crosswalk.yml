source: >-
  mcp/enigma-mcp.yml (published tool list) bound to the documented GraphQL and REST
  surfaces at documentation.enigma.com — no OpenAPI is published, so REST rows name the
  documented HTTP method + path rather than an operationId.
caveat: >-
  Enigma publishes no OpenAPI, and both live schemas are auth-gated (GraphQL
  introspection 401 UNAUTHORIZED without x-api-key; MCP tools/list 401 invalid_token).
  Every binding below is therefore mapped by NAME AND DOCUMENTED SEMANTICS, not by a
  machine-read schema, and confidence is set accordingly. Nothing here is invented: each
  tool, GraphQL field and REST path appears in Enigma's own documentation or in its
  first-party Agent Skills.
surfaces:
  openapi: null
  openapi_note: No OpenAPI/Swagger document is published on any Enigma host (see well-known probe).
  graphql:
    endpoint: https://api.enigma.com/graphql
    reference: https://documentation.enigma.com/reference/graphql_api
    introspection: gated
    introspection_evidence: 'POST {__schema{queryType{name}}} -> 401 {"error_code":"UNAUTHORIZED"}'
    surface_catalog: ../graphql/enigma-graphql-surface.yml
  rest:
  - name: KYB v2
    base: https://api.enigma.com/v2/kyb/
    reference: https://documentation.enigma.com/kyb
  - name: Screening
    base: https://api.enigma.com/evaluation/sanctions/
    reference: https://documentation.enigma.com/screening/api
  mcp:
    url: https://mcp.enigma.com/mcp
    tools_list: gated
    tools_list_evidence: 'POST tools/list -> 401 invalid_token (WWW-Authenticate: Bearer)'
