  note: 1 credit = 1 cent. Every published rate converts directly to U.S. dollars.
billing_rules:
- Charges apply to returned fills; an empty field costs nothing.
- KYB packages bill when a business matches; screening checks bill per request.
- Segment filters bill per entity on the list; attributes bill per returned fill.
- Included monthly credits reset on the account's monthly billing date and do not roll over.
- Prepaid credit bundles run $100–$1,000 and earn up to 25% bonus credits; extra credits
  last one year and require no plan change.
- Usage beyond included credits continues at the published retail rate.
