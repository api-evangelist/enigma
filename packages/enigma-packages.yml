sdk_posture: >-
  Enigma ships NO current first-party client SDK for the GraphQL Data API, the KYB v2
  REST API, or the Screening API. Every code sample in the documentation and in Enigma's
  own Agent Skills uses raw HTTP (Python urllib / requests / curl). The only currently
  maintained first-party packages are agent-tooling: an MCP stdio proxy and a Claude Code
  plugin. The two Python packages that ARE client libraries were published for Enigma
  Public, a retired open-data product, and have not been released since 2018. No `SDKs`
  pointer is emitted in apis.yml for that reason — recording one would credit Enigma with
  client libraries it does not currently ship.
packages:
- language: javascript
  registry: npm
  name: "@enigma-com/enigma-mcp-remote"
  url: https://www.npmjs.com/package/@enigma-com/enigma-mcp-remote
  install: npx -y @enigma-com/enigma-mcp-remote
  official: true
  kind: mcp-stdio-proxy
  version: 0.1.20
  published: '2025-08-13'
  release_count: 3
  license: MIT
  repository: https://github.com/enigma-io/enigma-mcp-remote
  description: >-
    Remote proxy for Model Context Protocol, allowing local-only clients to connect to
    remote servers using OAuth. A fork of Glen Maddern's mcp-remote, republished under
    Enigma's own npm scope; binaries enigma-mcp-remote and enigma-mcp-remote-client.
  note: >-
    This is a transport bridge for MCP clients that cannot speak streamable-HTTP — not an
    API client library. It does not wrap the GraphQL, KYB, or Screening APIs.
- language: python
  registry: github
  name: enigma-api (Claude Code plugin)
  url: https://github.com/enigma-io/enigma-claude-plugins
  install: /plugin marketplace add enigma-io/enigma-claude-plugins
  official: true
  kind: agent-skill-plugin
  version: 1.3.0
  published: '2026-06-09'
  published_basis: repository pushed_at (no package registry; distributed from GitHub)
  license: null
  description: >-
    Claude Code plugin marketplace publishing three Enigma Agent Skills (enigma-graphql,
    enigma-kyb, enigma-screen) plus query examples, filter/pagination references and a
    validate_query.py script.
  note: >-
    Distributed from the git repo, not a package registry, so there is no registry
    metadata endpoint to query; `version` is read from .claude-plugin/marketplace.json
    and `published` from the GitHub repo's pushed_at. See skills/_index.yml.
